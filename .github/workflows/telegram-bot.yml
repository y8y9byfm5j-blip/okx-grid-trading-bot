name: Telegram bot (paper, no server)
# Starts a time-boxed run every five minutes: answers pending Telegram commands,
# tracks money rotation, scans early longs and runs paper grid bots. State lives
# in a private Actions cache. Real OKX orders are never placed from a runner.
# With input teslim=true it only prints the bot settings encrypted with the
# owner's DELIVERY_CODE secret, for the server set-up, and runs no bot cycle.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      teslim:
        description: 'true = print the encrypted hand-over instead of running the bot'
        default: 'false'
concurrency:
  group: telegram-bot
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: kur
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Encrypted hand-over
        if: github.event_name == 'workflow_dispatch' && inputs.teslim == 'true'
        env:
          BOT_AUTH: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
          DELIVERY_CODE: ${{ secrets.DELIVERY_CODE }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m okx_grid.delivery encrypt "$RUNNER_TEMP/payload.enc"
          echo "-----BEGIN-----"
          cat "$RUNNER_TEMP/payload.enc"
          echo "-----END-----"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: inputs.teslim != 'true'
        with:
          path: ${{ runner.temp }}/okx-tr-state
          key: tgbot-state-${{ github.run_id }}
          restore-keys: tgbot-state-
      - name: Run one bot cycle
        if: inputs.teslim != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
          RUN_SECONDS: '240'
          TRADING_MODE: paper
          LIVE_TRADING: 'false'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m okx_grid.actions_run
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: always() && inputs.teslim != 'true'
        with:
          path: ${{ runner.temp }}/okx-tr-state
          key: tgbot-state-${{ github.run_id }}
