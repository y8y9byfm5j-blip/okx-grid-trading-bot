name: Validate paper trading code
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      TRADING_MODE: paper
      LIVE_TRADING: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Inspect committed files for private data
        run: python tools/check_repo_safety.py
      - name: Compile, validate required suites, test paper and release scenarios
        run: python tools/validate.py
      - name: Build exact commit and verify isolated staging
        if: matrix.python == '3.12'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tools.release import build, stage
          root = Path(os.environ['RUNNER_TEMP'])
          archive = root / 'paper-release.tar.gz'
          result = build(os.environ['GITHUB_SHA'], archive)
          print(stage(archive, result['sha256'], root / 'okx-grid-staging'))
          PY
