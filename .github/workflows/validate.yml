name: Validate paper trading code
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: |
          find . -type f -name '*.py' -not -path './.git/*' -print0 | xargs -0 -r python -m py_compile
      - name: Check shell syntax
        run: |
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r -n 1 bash -n
      - name: Check prohibited files
        run: python tools/check_repo_safety.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
